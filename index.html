    <meta name="description" content="Portfolio of Yehia Hatem Salah Salem — multidisciplinary designer, creative technologist, and dual-degree student in IMC & Computer Science." />
    <!-- GitHub Pages SPA redirect handler -->
    <script>
      (function() {
        const redirect = sessionStorage.getItem('redirect');
        if (redirect && redirect !== window.location.href) {
          sessionStorage.removeItem('redirect');
          window.history.replaceState(null, null, redirect);
        }
        const query = window.location.search;
        if (query && query.startsWith('?p=')) {
          const path = query.slice(3);
          window.history.replaceState(null, null,
            window.location.pathname.replace(/\/$/, '') + path + window.location.hash
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
